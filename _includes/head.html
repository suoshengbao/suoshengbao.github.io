<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  {% assign description = page.excerpt | default: site.description | strip_html | strip_newlines | normalize_whitespace | truncate: 180 %}
  <meta name="description" content="{{ description | escape }}">
  <meta name="theme-color" content="#153f48">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SuoLab at Guangzhou Laboratory">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/homepage/Fig1.png' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="icon" href="{{ '/images/log.ico' | relative_url }}" type="image/x-icon">
  {% if jekyll.environment == 'production' %}{% include analytics.html %}{% endif %}
</head>
