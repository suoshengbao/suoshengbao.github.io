<section class="news-panel">
  <div class="section-heading"><h2 id="news-title">News</h2></div>
  {% for article in site.data.news limit:5 %}
  <article class="news-item"><p class="news-date">{{ article.date }}</p><p>{{ article.headline }}</p>{% if article.url %}<a class="text-link" href="{{ article.url }}">Read the paper</a>{% endif %}</article>
  {% endfor %}
  <a class="text-link news-all" href="{{ '/allnews.html' | relative_url }}">All news</a>
</section>
