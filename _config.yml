# SuoLab — Jekyll configuration
title: The Suo Lab
email: suo_shengbao@gzlab.ac.cn
description: SuoLab at Guangzhou Laboratory combines single-cell and spatial multi-omics with computational
  biology to understand immune regulation and cancer.
baseurl: ''
url: https://suoshengbao.github.io
include:
- _pages
sass:
  sass_dir: _sass
  cache: false
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
exclude:
- Gemfile
- Gemfile.lock
- README.md
- vendor
- work
- outputs
- .sass-cache
- .jekyll-cache
